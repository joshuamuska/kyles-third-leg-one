name: Daily ESPN update

on:
  schedule:
    - cron: "0 14 * * *"   # every day, about 10am Eastern (9am in winter); saved recaps are reused
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: espn-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull this season from ESPN
        run: python scripts/update.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the new data
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update league data"
          git push
