<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyle's 3rd Leg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --text:#141C2B; --muted:#535E70; --line:#D5DCD1; --row:#EBF0E7;
  --turf:#013369; --turf-deep:#00234A; --on-turf:#F3F5EF; --gold:#D50A0A; --gold-text:#B0080A; --gold-soft:#FBE1E1;
  --btn:#D50A0A; --field:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1628; --surface:#112139; --text:#E8EDF5; --muted:#A3B1C6; --line:#263A5A; --row:#162A47;
    --turf:#013369; --turf-deep:#00234A; --on-turf:#F3F5EF; --gold:#E8302F; --gold-text:#FF7A78; --gold-soft:#3F1A22;
    --btn:#C8102E; --field:#0A1628;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#112139; --text:#E8EDF5; --muted:#A3B1C6; --line:#263A5A; --row:#162A47;
  --turf:#013369; --turf-deep:#00234A; --on-turf:#F3F5EF; --gold:#E8302F; --gold-text:#FF7A78; --gold-soft:#3F1A22;
  --btn:#C8102E; --field:#0A1628;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.display{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}

/* Header: a strip of turf with yard lines */
header{
  background:
    repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.07) 79px 81px),
    linear-gradient(180deg,var(--turf),var(--turf-deep));
  color:var(--on-turf);
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.masthead{padding:36px 0 18px}
.masthead h1{margin:0;font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:clamp(3rem,9vw,6.2rem);line-height:.86;letter-spacing:-.01em}
.masthead p{margin:12px 0 0;color:rgba(243,245,239,.78);font-size:1.02rem}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -8px}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;padding:12px 12px 13px;font-weight:600;color:rgba(243,245,239,.75);border-bottom:3px solid transparent}
nav a:hover{color:var(--on-turf)}
nav a[aria-current="page"]{color:var(--on-turf);border-bottom-color:var(--gold)}

main.wrap{padding:34px 20px 60px}
h2{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:2.1rem;line-height:1;margin:0 0 6px}
h3{font-size:1.1rem;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
section+section{margin-top:52px}

/* Rafters: championship banners */
.rafters{position:relative;margin:4px 0 0;padding-top:10px;overflow-x:auto}
.rod{position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:var(--gold);min-width:760px}
.banners{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:16px;min-width:760px;padding:0 8px}
.banner{position:relative;margin-top:3px;text-decoration:none;color:var(--on-turf);
  background:linear-gradient(180deg,var(--turf),var(--turf-deep));
  clip-path:polygon(0 0,100% 0,100% 100%,50% 90%,0 100%);
  padding:20px 14px 46px;text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center}
.banner::before{content:"";position:absolute;inset:8px 8px auto;height:2px;background:var(--gold)}
.banner .yr{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:3.1rem;line-height:1;color:var(--on-turf);margin-top:8px}
.banner .who{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.7rem;line-height:1.05;margin-top:12px}
.banner .tm{font-size:.92rem;color:rgba(243,245,239,.8);margin-top:6px;line-height:1.25}
.banner .rc{margin-top:auto;font-weight:600;font-size:.9rem;color:rgba(243,245,239,.72)}
.banner:hover .who{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}

/* Tables */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;white-space:nowrap}
th{font-size:.85rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--text)}
th .dir{display:inline-block;width:1em;color:var(--gold-text)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:var(--row)}
td.num,th.num{text-align:right}
td a{text-decoration:none;font-weight:600}
td a:hover{text-decoration:underline}
tr.champ td{background:var(--gold-soft)}
tr.champ td:first-child{box-shadow:inset 4px 0 var(--gold)}
.team{color:var(--muted);font-size:.92rem}
.po{color:var(--gold-text);font-weight:700}
.former{color:var(--muted);font-size:.85rem;font-weight:500}

/* Year chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chips a{text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chips a[aria-current="page"]{background:var(--turf);border-color:var(--turf);color:var(--on-turf)}
.note{color:var(--muted);font-size:.92rem;margin:12px 0 0;max-width:70ch}

/* Managers */
.mgrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mgr{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mgr:hover{border-color:var(--gold)}
.mgr .n{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.6rem;line-height:1.05}
.mgr .t{color:var(--muted);font-size:.92rem}
.mgr .s{margin-top:8px;font-weight:600;font-size:.92rem}
.trophies{color:var(--gold-text)}

.profile-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:20px}
.profile-head h2{font-size:clamp(2.6rem,7vw,4rem);margin:0}
.profile-head p{margin:0 0 6px;color:var(--muted)}
.back{display:inline-block;margin-bottom:16px;text-decoration:none;font-weight:600;color:var(--muted)}
.back:hover{color:var(--text)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:24px}
.strip div{background:var(--surface);padding:12px 14px}
.strip b{display:block;font-family:"Big Shoulders Display",Impact,sans-serif;font-size:1.9rem;line-height:1.05;font-weight:800}
.strip span{color:var(--muted);font-size:.88rem}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 6px;margin-bottom:24px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:.85rem;padding:4px 4px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* Records */
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.rec h3{color:var(--muted);font-weight:600;font-size:.95rem}
.rec .v{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:2.2rem;line-height:1.05;margin:2px 0 6px}
.rec ul{list-style:none;margin:0;padding:0}
.rec li{padding:2px 0}
.rec li a{font-weight:600;text-decoration:none}
.rec li a:hover{text-decoration:underline}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 24px;max-width:640px}
.empty p{margin:6px 0 0;color:var(--muted)}

.matchups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mc .line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0}
.mc .line .nm{min-width:0}
.mc .line .nm small{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .sc{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.7rem;line-height:1;color:var(--muted)}
.mc .won .sc{color:var(--text)}
.mc .won .nm a{color:var(--text)}
.mc .tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--gold-text);margin-bottom:4px}
.mc .recap{margin:10px 0 0;font-size:.95rem;line-height:1.5}
.mc details{margin-top:10px;font-size:.88rem}
.mc summary{cursor:pointer;color:var(--muted);font-weight:600}
.lineups{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px}
.lineups table{min-width:0;font-size:.88rem;table-layout:fixed}
.lineups td{padding:4px 6px;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lineups td:first-child{width:52px;color:var(--muted);font-weight:600;font-size:.8rem}
.lineups td:last-child{width:52px}
.lineups tr.tot td{border-top:1px solid var(--line);font-weight:700}
.lineups tbody tr:nth-child(even){background:none}
.lineups .bn td{color:var(--muted)}
.lineups h4{margin:0 0 2px;font-size:.85rem}
.live-note{color:var(--muted);font-size:.9rem;margin:-14px 0 22px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:20px 0 30px}

/* Forum */
.forum{max-width:760px}
.compose,.thread{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.compose{padding:16px 18px;margin-bottom:28px}
.who-row{display:flex;flex-wrap:wrap;gap:12px 16px;margin-bottom:12px}
.who-row label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);flex:1 1 200px}
.forum input,.forum select,.forum textarea{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.forum textarea{display:block;resize:vertical;min-height:84px;line-height:1.45}
.form-foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.form-foot .count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.form-foot .count.over{color:var(--gold-text);font-weight:700}
.form-foot .msg{flex:1;font-size:.9rem;color:var(--gold-text);font-weight:600;min-width:0}
.btn{font:700 .95rem/1 "Barlow",system-ui,sans-serif;background:var(--btn);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.threads{display:grid;gap:14px}
.thread{padding:16px 18px}
.post .meta{display:flex;align-items:baseline;gap:10px}
.post .au{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.4rem;line-height:1.1}
.post time{color:var(--muted);font-size:.85rem}
.post .body{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.replies{margin:14px 0 0 4px;padding-left:14px;border-left:3px solid var(--gold);display:grid;gap:12px}
.replies .au{font-size:1.15rem}
.linkbtn{all:unset;cursor:pointer;margin-top:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.linkbtn:hover{color:var(--text)}
.reply-form{margin-top:12px}
.reply-form textarea{min-height:64px}
/* Rosters and transactions */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;padding:10px 14px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--gold)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin:0 0 18px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);flex:0 1 240px}
.filters select{font:inherit;font-size:1rem;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.tx-count{color:var(--muted);font-size:.9rem;margin:-6px 0 12px}
.rosters{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.roster .n{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.6rem;line-height:1.05}
.roster .n a{text-decoration:none}
.roster .n a:hover{text-decoration:underline}
.roster .t{color:var(--muted);font-size:.92rem;margin-bottom:6px}
.roster table{min-width:0;font-size:.9rem;table-layout:fixed}
.roster td{padding:4px 6px;border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster tbody tr:nth-child(even){background:none}
.roster col.c-sl{width:50px}
.roster col.c-nfl{width:48px}
.roster col.c-pt{width:56px}
.roster td.sl{color:var(--muted);font-weight:600;font-size:.8rem}
.roster td.nfl{color:var(--muted);font-size:.85rem}
.roster tr.grp td{padding:12px 6px 3px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.roster tr.grp:first-child td{padding-top:4px}
.roster tr.bn td:not(.sl){color:var(--muted)}
.inj{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:var(--gold-soft);color:var(--gold-text);font-size:.72rem;font-weight:700;line-height:1.5;vertical-align:1px}
.txs{display:grid;gap:10px;max-width:760px}
.tx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.tx .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.tx .kind{font-size:.8rem;font-weight:700;color:var(--gold-text)}
.tx .by{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:1.35rem;line-height:1.1}
.tx .by a{text-decoration:none}
.tx .by a:hover{text-decoration:underline}
.tx time{margin-left:auto;color:var(--muted);font-size:.85rem}
.tx ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.tx li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.tx .mv{flex:none;min-width:44px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tx .mv.add{color:var(--text)}
.tx .pn{font-weight:600}
.tx .bid{font-weight:700;font-variant-numeric:tabular-nums}
.tx .since{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.tx .since.hot{color:var(--gold-text);font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:600px){
  .masthead{padding-top:26px}
  th,td{padding:9px 10px}
}
@media (prefers-reduced-motion:no-preference){
  .banner{animation:drop .5s ease-out both}
  .banner:nth-child(2){animation-delay:.06s}.banner:nth-child(3){animation-delay:.12s}
  .banner:nth-child(4){animation-delay:.18s}.banner:nth-child(5){animation-delay:.24s}
  @keyframes drop{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>

  [2025,"josh","OMM",6,8,9,0],
  [2025,"reis","Going Dark",4,10,10,0]
].map(r=>({year:r[0],id:r[1],team:r[2],w:r[3],l:r[4],place:r[5],po:!!r[6]}));

let YEARS=[], ALL=[], LIVES=[], LIVE=null;
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (w,l) => (w+l) ? w/(w+l) : 0;
const fmtPct = p => p.toFixed(3).replace(/^0/,"");
const ord = n => n + (["th","st","nd","rd"][(n%100-20)%10] || ["th","st","nd","rd"][n%100] || "th");
const mlink = id => `<a href="#/managers/${id}">${esc(M[id].name)}</a>`;

function stats(id){
  const rows = S.filter(r=>r.id===id).sort((a,b)=>a.year-b.year);
  const w = rows.reduce((a,r)=>a+r.w,0), l = rows.reduce((a,r)=>a+r.l,0);
  let streak=1, best=1;
  for(let i=1;i<rows.length;i++){ streak = rows[i].team===rows[i-1].team ? streak+1 : 1; best=Math.max(best,streak); }
  return {
    id, rows, w, l, p:pct(w,l), seasons:rows.length,
    titles:rows.filter(r=>r.place===1).length,
    top3:rows.filter(r=>r.place<=3).length,
    po:rows.filter(r=>r.po).length,
    avg:rows.reduce((a,r)=>a+r.place,0)/rows.length,
    bestFinish:Math.min(...rows.map(r=>r.place)),
    names:new Set(rows.map(r=>r.team)).size,
    nameStreak:best
  };
}
function rebuild(){
  LIVES.forEach(d=>{
    if(d.seasonOver && !S.some(r=>r.year===d.season))
      d.teams.forEach(t=>{ if(t.manager && M[t.manager]) S.push({year:d.season,id:t.manager,team:t.name,w:t.w,l:t.l,place:t.final,po:t.seed<=d.playoffTeams}); });
  });
  YEARS=[...new Set(S.map(r=>r.year))].sort();
  ALL=Object.keys(M).filter(id=>S.some(r=>r.id===id)).map(stats);
}
const who = s => s.manager&&M[s.manager] ? mlink(s.manager) : esc(s.owner||s.name||"Unknown");
const liveOpen = () => LIVE && !LIVE.seasonOver ? LIVE : null;
const SLOT_ORDER=["QB","RB","WR","TE","FLEX","D/ST","K"];
const slotName=s=>s==="RB/WR/TE"||s==="WR/TE"||s==="RB/WR"?"FLEX":s;
const slotRank=s=>{const i=SLOT_ORDER.indexOf(slotName(s));return i<0?SLOT_ORDER.length:i;};
function matchCard(m, opts={}){
  const fin=m.final, hiScore=Math.max(m.home.score,m.away.score);
  const line=s=>`<div class="line ${fin&&s.score===hiScore&&m.home.score!==m.away.score?"won":""}">
    <div class="nm">${who(s)}<small>${esc(s.name||"")}</small></div><div class="sc">${s.score.toFixed(2)}</div></div>`;
  const lu=s=>`<div><h4>${s.manager&&M[s.manager]?esc(M[s.manager].name):esc(s.name||"")}</h4><table><tbody>
    ${[...s.starters].sort((a,b)=>slotRank(a.slot)-slotRank(b.slot)).map(p=>`<tr><td>${esc(slotName(p.slot))}</td><td title="${esc(p.name)}">${esc(p.name)}</td><td class="num">${p.pts.toFixed(1)}</td></tr>`).join("")}
    <tr class="tot"><td></td><td>Total</td><td class="num">${s.score.toFixed(1)}</td></tr>
    ${s.bench.map(p=>`<tr class="bn"><td>BN</td><td title="${esc(p.name)}">${esc(p.name)}</td><td class="num">${p.pts.toFixed(1)}</td></tr>`).join("")}
  </tbody></table></div>`;
  return `<div class="mc">${m.playoff?`<span class="tag">${m.type&&/WINNER/.test(m.type)?"Playoffs":"Consolation"}</span>`:""}
    ${line(m.away)}${line(m.home)}
    ${m.recap?`<p class="recap">${esc(opts.short?m.recap.split(/(?<=\.)\s/)[0]:m.recap)}</p>`:fin?"":`<p class="recap" style="color:var(--muted)">In progress</p>`}
    ${opts.short?"":`<details><summary>Lineups</summary><div class="lineups">${lu(m.away)}${lu(m.home)}</div></details>`}</div>`;
}

/* ---------- Views ---------- */
function home(){
  const champs = YEARS.map(y=>S.find(r=>r.year===y&&r.place===1));
  return `
  <section>
    <h2>Champions</h2>
    <p class="lede">Every title since 2021. Seasons before that were lost in the move from NFL.com.</p>
    <div class="rafters"><div class="rod"></div>
      <div class="banners">${champs.map(c=>`
        <a class="banner" href="#/seasons/${c.year}">
          <span class="yr">${c.year}</span>
          <span class="who">${esc(M[c.id].name)}</span>
          <span class="tm">${esc(c.team)}</span>
          <span class="rc">${c.w}-${c.l}</span>
        </a>`).join("")}
      </div>
    </div>
  </section>
  ${latestWeek()}
  <section>
    <h2>All-time standings</h2>
    <p class="lede">Regular-season records, ${YEARS[0]}–${YEARS[YEARS.length-1]}. Select a column to sort.</p>
    <div id="alltime"></div>
  </section>`;
}

let sortKey="p", sortDir=-1;
const COLS = [
  {k:"name",label:"Manager",get:s=>M[s.id].name},
  {k:"seasons",label:"Seasons",num:1},
  {k:"rec",label:"Record",num:1,get:s=>s.w,show:s=>`${s.w}-${s.l}`},
  {k:"p",label:"Win %",num:1,show:s=>fmtPct(s.p)},
  {k:"titles",label:"Titles",num:1},
  {k:"top3",label:"Top 3",num:1},
  {k:"po",label:"Playoffs",num:1},
  {k:"avg",label:"Avg finish",num:1,show:s=>s.avg.toFixed(1),asc:1}
];
function renderAllTime(){
  const el=document.getElementById("alltime"); if(!el) return;
  const col=COLS.find(c=>c.k===sortKey); const get=col.get||(s=>s[col.k]);
  const rows=[...ALL].sort((a,b)=>{const x=get(a),y=get(b);return (x>y?1:x<y?-1:0)*sortDir || b.p-a.p;});
  el.innerHTML=`<div class="scroll"><table><thead><tr>${COLS.map(c=>`
    <th class="${c.num?"num":""}" aria-sort="${c.k===sortKey?(sortDir>0?"ascending":"descending"):"none"}">
      <button data-k="${c.k}">${c.label}<span class="dir">${c.k===sortKey?(sortDir>0?"▲":"▼"):""}</span></button></th>`).join("")}
    </tr></thead><tbody>${rows.map(s=>`<tr>
      <td>${mlink(s.id)}${M[s.id].former?` <span class="former">former</span>`:""}</td>
      <td class="num">${s.seasons}</td>
      <td class="num">${s.w}-${s.l}</td>
      <td class="num">${fmtPct(s.p)}</td>
      <td class="num">${s.titles?`<span class="trophies">${"🏆".repeat(s.titles)}</span>`:"0"}</td>
      <td class="num">${s.top3}</td>
      <td class="num">${s.po}</td>
      <td class="num">${s.avg.toFixed(1)}</td></tr>`).join("")}
    </tbody></table></div>`;
  el.querySelectorAll("th button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k===sortKey) sortDir*=-1; else { sortKey=k; const c=COLS.find(c=>c.k===k); sortDir=c.asc||c.k==="name"?1:-1; }
    renderAllTime();
  });
}

function season(y){
  y=+y; if(!YEARS.includes(y)) y=YEARS[YEARS.length-1];
  const rows=S.filter(r=>r.year===y).sort((a,b)=>a.place-b.place);
  const champ=rows[0], runner=rows[1];
  return `<section>
    <h2>${y} season</h2>
    <p class="lede">${esc(M[champ.id].name)} won it all as ${esc(champ.team)} (${champ.w}-${champ.l}), beating out ${esc(M[runner.id].name)} in 2nd.</p>
    <div class="chips">${YEARS.map(x=>`<a href="#/seasons/${x}" ${x===y?'aria-current="page"':""}>${x}</a>`).join("")}${liveOpen()?`<a href="#/live">${LIVE.season}</a>`:""}</div>
    <div class="scroll"><table><thead><tr>
      <th class="num">Finish</th><th>Manager</th><th>Team</th><th class="num">Record</th><th class="num">Win %</th><th>Playoffs</th>
    </tr></thead><tbody>${rows.map(r=>`<tr class="${r.place===1?"champ":""}">
      <td class="num">${ord(r.place)}${r.place===1?" 🏆":""}</td>
      <td>${mlink(r.id)}</td>
      <td class="team">${esc(r.team)}</td>
      <td class="num">${r.w}-${r.l}</td>
      <td class="num">${fmtPct(pct(r.w,r.l))}</td>
      <td>${r.po?'<span class="po">Made it</span>':""}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">Six teams make the playoffs. Final places include playoff and consolation games, so they don't always follow regular-season records.</p>
  </section>`;
}

function managers(){
  const active=ALL.filter(s=>!M[s.id].former).sort((a,b)=>b.titles-a.titles||b.p-a.p);
  const former=ALL.filter(s=>M[s.id].former);
  const card=s=>`<a class="mgr" href="#/managers/${s.id}">
    <div class="n">${esc(M[s.id].name)}</div>
    <div class="t">${M[s.id].former?esc(M[s.id].former):esc(M[s.id].now)}</div>
    <div class="s">${s.w}-${s.l} career${s.titles?` <span class="trophies">${"🏆".repeat(s.titles)}</span>`:""}</div></a>`;
  return `<section><h2>Managers</h2><p class="lede">Current team names, career records and titles.</p>
    <div class="mgrs">${active.map(card).join("")}</div></section>
    <section><h2>Former managers</h2><p class="lede">Their seasons still count in the all-time stats.</p>
    <div class="mgrs">${former.map(card).join("")}</div></section>`;
}

function chart(s){
  const W=520,H=230,L=34,R=16,T=14,B=30;
  const x=y=>L+(YEARS.indexOf(y))*((W-L-R)/(YEARS.length-1));
  const yy=p=>T+(p-1)*((H-T-B)/9);
  const pts=s.rows.map(r=>[x(r.year),yy(r.place),r]);
  let g="";
  for(let p=1;p<=10;p++) g+=`<line x1="${L}" x2="${W-R}" y1="${yy(p)}" y2="${yy(p)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${L-10}" y="${yy(p)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${p}</text>`;
  g+=YEARS.map(y=>`<text x="${x(y)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${y}</text>`).join("");
  const path=pts.length>1?`<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--text)" stroke-width="2" opacity=".55"/>`:"";
  const dots=pts.map(([px,py,r])=>{
    const fill=r.place===1?"var(--gold)":r.po?"var(--turf)":"var(--surface)";
    const stroke=r.place===1?"var(--gold)":"var(--text)";
    return `<circle cx="${px}" cy="${py}" r="${r.place===1?8:6}" fill="${fill}" stroke="${stroke}" stroke-width="2"><title>${r.year}: ${ord(r.place)}, ${r.w}-${r.l}</title></circle>`;
  }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Final finish by season">${g}${path}${dots}</svg>
    <div class="legend"><span><i style="background:var(--gold)"></i>Champion</span><span><i style="background:var(--turf);border:2px solid var(--text)"></i>Made playoffs</span><span><i style="background:var(--surface);border:2px solid var(--text)"></i>Missed playoffs</span></div></div>`;
}

function profile(id){
  const m=M[id]; if(!m) return managers();
  const s=ALL.find(x=>x.id===id); if(!s) return managers();
  const sub=[m.full, m.role, m.former?m.former:`Now playing as ${m.now}`].filter(Boolean).map(esc).join(". ");
  return `<section>
    <a class="back" href="#/managers">All managers</a>
    <div class="profile-head"><h2>${esc(m.name)}</h2><p>${sub}</p></div>
    <div class="strip">
      <div><b>${s.w}-${s.l}</b><span>Career record</span></div>
      <div><b>${fmtPct(s.p)}</b><span>Win %</span></div>
      <div><b>${s.titles}</b><span>Championships</span></div>
      <div><b>${s.po}</b><span>Playoff trips</span></div>
      <div><b>${s.avg.toFixed(1)}</b><span>Average finish</span></div>
      <div><b>${ord(s.bestFinish)}</b><span>Best finish</span></div>
    </div>
    <h3>Finish by season</h3>
    ${chart(s)}
    <div class="scroll"><table><thead><tr><th>Season</th><th>Team</th><th class="num">Record</th><th class="num">Finish</th><th>Playoffs</th></tr></thead>
    <tbody>${s.rows.map(r=>`<tr class="${r.place===1?"champ":""}">
      <td><a href="#/seasons/${r.year}">${r.year}</a></td>
      <td class="team">${esc(r.team)}</td>
      <td class="num">${r.w}-${r.l}</td>
      <td class="num">${ord(r.place)}${r.place===1?" 🏆":""}</td>
      <td>${r.po?'<span class="po">Made it</span>':""}</td></tr>`).join("")}${(()=>{
        const d=liveOpen(); const t=d&&d.teams.find(t=>t.manager===id); if(!t) return "";
        return `<tr><td><a href="#/live">${d.season}</a></td><td class="team">${esc(t.name)}</td><td class="num">${t.w}-${t.l}${t.t?"-"+t.t:""}</td><td class="num">Seed ${t.seed}</td><td class="team">In progress</td></tr>`;})()}</tbody></table></div>
  </section>`;
}

function records(){
  const top=(arr,f)=>{const v=Math.max(...arr.map(f));return {v,items:arr.filter(x=>f(x)===v)};};
  const sp=r=>pct(r.w,r.l);
  const seasonLine=r=>`<li>${mlink(r.id)}, ${r.year} <span class="team">(${esc(r.team)})</span></li>`;
  const out=[];
  let t;
  t=top(S,sp); out.push({h:"Best regular season",v:`${t.items[0].w}-${t.items[0].l}`,li:t.items.map(seasonLine)});
  t=top(S,r=>-sp(r)); out.push({h:"Worst regular season",v:`${t.items[0].w}-${t.items[0].l}`,li:t.items.map(seasonLine)});
  t=top(ALL,s=>s.titles); out.push({h:"Most championships",v:t.v,li:t.items.map(s=>`<li>${mlink(s.id)}</li>`)});
  t=top(ALL,s=>s.po); out.push({h:"Most playoff trips",v:t.v,li:t.items.map(s=>`<li>${mlink(s.id)}</li>`)});
  const reg=ALL.filter(s=>s.seasons>=3);
  t=top(reg,s=>s.p); out.push({h:"Best career win % (3+ seasons)",v:fmtPct(t.v),li:t.items.map(s=>`<li>${mlink(s.id)} <span class="team">${s.w}-${s.l}</span></li>`)});
  t=top(S.filter(r=>r.place===1),r=>-sp(r)); out.push({h:"Champion with the worst record",v:`${t.items[0].w}-${t.items[0].l}`,li:t.items.map(seasonLine)});
  t=top(S.filter(r=>!r.po),sp); out.push({h:"Best record to miss the playoffs",v:`${t.items[0].w}-${t.items[0].l}`,li:t.items.map(seasonLine)});
  t=top(S.filter(r=>r.po),r=>-sp(r)); out.push({h:"Worst record to make the playoffs",v:`${t.items[0].w}-${t.items[0].l}`,li:t.items.map(seasonLine)});
  const jumps=[];
  ALL.forEach(s=>{for(let i=1;i<s.rows.length;i++){const a=s.rows[i-1],b=s.rows[i];if(b.year===a.year+1)jumps.push({id:s.id,a,b,d:a.place-b.place});}});
  const jl=j=>`<li>${mlink(j.id)}, ${ord(j.a.place)} in ${j.a.year} to ${ord(j.b.place)} in ${j.b.year}</li>`;
  t=top(jumps,j=>j.d); out.push({h:"Biggest one-year climb",v:`${t.v} spots`,li:t.items.map(jl)});
  t=top(jumps,j=>-j.d); out.push({h:"Biggest one-year fall",v:`${t.v} spots`,li:t.items.map(jl)});
  t=top(ALL,s=>s.names); out.push({h:"Most team names",v:t.v,li:t.items.map(s=>`<li>${mlink(s.id)}</li>`)});
  t=top(ALL,s=>s.nameStreak); out.push({h:"Longest run with one name",v:`${t.v} seasons`,li:t.items.map(s=>`<li>${mlink(s.id)} <span class="team">(${esc(s.rows[0].team)})</span></li>`)});
  return `<section><h2>League records</h2>
    <p class="lede">Worked out from 2021–2025 records and finishes. Scoring records start once 2026 data comes in from ESPN.</p>
    <div class="records">${out.map(o=>`<div class="rec"><h3>${o.h}</h3><div class="v">${o.v}</div><ul>${o.li.join("")}</ul></div>`).join("")}</div></section>
    ${scoringRecords()}`;
}

function scoringRecords(){
  const games=[]; LIVES.forEach(d=>d.weeks.forEach(w=>w.matchups.forEach(m=>{ if(m.final) games.push({season:d.season,week:w.week,m}); })));
  if(!games.length) return "";
  const sides=games.flatMap(g=>[g.m.home,g.m.away].map((s,i,arr)=>({...g,s,o:arr[1-i]})));
  const top=(arr,f)=>{const v=Math.max(...arr.map(f));return {v,items:arr.filter(x=>f(x)===v)};};
  const sl=x=>`<li>${who(x.s)}, week ${x.week}, ${x.season} <span class="team">vs ${x.o.manager&&M[x.o.manager]?esc(M[x.o.manager].name):esc(x.o.name||"")}</span></li>`;
  const gl=g=>`<li>${who(g.m.away)} vs ${who(g.m.home)}, week ${g.week}, ${g.season}</li>`;
  const margin=g=>Math.abs(g.m.home.score-g.m.away.score);
  const out=[]; let t;
  t=top(sides,x=>x.s.score); out.push({h:"Highest score",v:t.v.toFixed(2),li:t.items.map(sl)});
  t=top(sides,x=>-x.s.score); out.push({h:"Lowest score",v:(-t.v).toFixed(2),li:t.items.map(sl)});
  t=top(games,margin); out.push({h:"Biggest blowout",v:t.v.toFixed(2),li:t.items.map(gl)});
  t=top(games,g=>-margin(g)); out.push({h:"Closest game",v:(-t.v).toFixed(2),li:t.items.map(gl)});
  const losses=sides.filter(x=>x.s.score<x.o.score), wins=sides.filter(x=>x.s.score>x.o.score);
  if(losses.length){t=top(losses,x=>x.s.score); out.push({h:"Most points in a loss",v:t.v.toFixed(2),li:t.items.map(sl)});}
  if(wins.length){t=top(wins,x=>-x.s.score); out.push({h:"Fewest points in a win",v:(-t.v).toFixed(2),li:t.items.map(sl)});}
  return `<section><h2>Scoring records</h2><p class="lede">Weekly scores from ESPN seasons, ${LIVES[0].season} on.</p>
    <div class="records">${out.map(o=>`<div class="rec"><h3>${o.h}</h3><div class="v">${o.v}</div><ul>${o.li.join("")}</ul></div>`).join("")}</div></section>`;
}

function latestWeek(){
  const d=liveOpen(); if(!d) return "";
  const wk=[...d.weeks].reverse().find(w=>w.final); if(!wk) return "";
  return `<section><h2>Week ${wk.week} results</h2>
    <p class="lede"><a href="#/live/${wk.week}">Full recaps and lineups</a></p>
    <div class="matchups">${wk.matchups.map(m=>matchCard(m,{short:1})).join("")}</div></section>`;
}

function live(week){
  if(!LIVE) return `<section><h2>This season</h2>
    <p class="lede">Standings, scores and recaps load here from ESPN.</p>
    <div class="empty"><h3>No ESPN data yet</h3>
      <p>Run the "Daily ESPN update" workflow from the Actions tab on GitHub. This page fills in once it finishes. After that it updates every morning.</p></div></section>`;
  const d=LIVE, over=d.seasonOver;
  const teams=[...d.teams].sort((a,b)=>over?a.final-b.final:a.seed-b.seed);
  const wks=d.weeks; const fin=wks.filter(w=>w.final);
  const sel=wks.find(w=>w.week===+week) || fin[fin.length-1] || wks[wks.length-1];
  const upd=new Date(d.updated);
  return `<section><h2>${d.season} season</h2>
    <p class="lede">${over?"Final standings.":`Standings after week ${fin.length?fin[fin.length-1].week:0}. Top ${d.playoffTeams} make the playoffs.`}</p>
    <p class="live-note">Last updated from ESPN ${upd.toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</p>
    <div class="scroll"><table><thead><tr><th class="num">${over?"Finish":"Seed"}</th><th>Manager</th><th>Team</th><th class="num">Record</th><th class="num">Points for</th><th class="num">Points against</th></tr></thead>
    <tbody>${teams.map(t=>`<tr class="${over&&t.final===1?"champ":""}">
      <td class="num">${over?ord(t.final)+(t.final===1?" 🏆":""):t.seed}</td><td>${who(t)}</td><td class="team">${esc(t.name)}</td>
      <td class="num">${t.w}-${t.l}${t.t?"-"+t.t:""}</td><td class="num">${t.pf.toFixed(2)}</td><td class="num">${t.pa.toFixed(2)}</td></tr>`).join("")}
    </tbody></table></div></section>
  ${sel?`<section><h2>Week ${sel.week}${sel.playoff?" playoffs":""}</h2>
    <div class="chips">${wks.map(w=>`<a href="#/live/${w.week}" ${w===sel?'aria-current="page"':""}>${w.week}</a>`).join("")}</div>
    <div class="matchups">${sel.matchups.map(m=>matchCard(m)).join("")}</div></section>`:""}`;
}

/* ---------- Rosters ---------- */
const POS_ORDER=["QB","RB","WR","TE","D/ST","K"];
const INJ={QUESTIONABLE:"Q",DOUBTFUL:"D",OUT:"O",INJURY_RESERVE:"IR",SUSPENSION:"SSPD",PROBABLE:"P",DAY_TO_DAY:"DTD"};
const TX_KINDS={waiver:"Waiver claim",fa:"Free agent add",drop:"Drop",trade:"Trade"};
let rosterTeam="all", txKind="all", txTeam="all";   // picks reset on reload, so the page opens on all teams
const teamById=id=>LIVE&&LIVE.teams.find(t=>t.espnId===id);
const teamWho=id=>{const t=teamById(id); return t?who(t):"Unknown";};
const teamLabel=t=>t.manager&&M[t.manager]?M[t.manager].name:(t.owner||t.name);
const teamsByName=()=>[...LIVE.teams].sort((a,b)=>teamLabel(a).localeCompare(teamLabel(b)));
const injTag=s=>s?` <span class="inj" title="${esc(s.replace(/_/g," ").toLowerCase())}">${esc(INJ[s]||s.slice(0,4))}</span>`:"";

function rosterCard(r){
  const t=teamById(r.espnId)||{espnId:r.espnId,name:""};
  const rank=p=>{const i=POS_ORDER.indexOf(p.pos);return i<0?POS_ORDER.length:i;};
  const by=(a,b)=>rank(a)-rank(b)||b.pts-a.pts;
  const bench=s=>s==="BE"||s==="IR";
  const start=r.players.filter(p=>!bench(p.slot)).sort(by);
  const groups=[...new Set([...POS_ORDER,...start.map(p=>p.pos)])].map(g=>[g,start.filter(p=>p.pos===g),0])
    .concat([["Bench",r.players.filter(p=>p.slot==="BE").sort(by),1],["IR",r.players.filter(p=>p.slot==="IR").sort(by),1]]);
  const row=(p,bn)=>`<tr class="${bn?"bn":""}"><td class="sl">${esc(bn?p.pos:slotName(p.slot))}</td>
    <td title="${esc(p.name)}">${esc(p.name)}${injTag(p.injury)}</td><td class="nfl">${esc(p.nfl)}</td><td class="num">${p.pts.toFixed(1)}</td></tr>`;
  return `<div class="roster"><div class="n">${who(t)}</div><div class="t">${esc(t.name||"")}</div>
    <table><colgroup><col class="c-sl"><col><col class="c-nfl"><col class="c-pt"></colgroup><tbody>${groups.filter(g=>g[1].length).map(([g,ps,bn],i)=>
      `<tr class="grp"><td colspan="3">${esc(g)}</td><td class="num">${i?"":"Pts"}</td></tr>${ps.map(p=>row(p,bn)).join("")}`).join("")}
    </tbody></table></div>`;
}

function txCard(x){
  const kind=["trade","waiver","fa","drop"].find(k=>x.types.includes(k));
  const pl=m=>`<span class="pn">${esc(m.name)}</span>${m.pos||m.nfl?` <span class="team">${esc([m.pos,m.nfl].filter(Boolean).join(", "))}</span>`:""}`;
  const date=x.date?new Date(x.date):null;
  let by, lines;
  if(kind==="trade"){
    const sides=[...new Set(x.moves.map(m=>m.to))];
    by=sides.map(teamWho).join(" &amp; ");
    lines=sides.map(id=>`<li><span class="mv add">${esc(teamById(id)?teamLabel(teamById(id)):"Unknown")} gets</span><span>${x.moves.filter(m=>m.to===id).map(pl).join(", ")}</span></li>`);
  }else{
    by=[...new Set(x.moves.map(m=>m.team))].map(teamWho).join(" &amp; ");
    lines=[...x.moves].sort((a,b)=>(a.action==="drop")-(b.action==="drop")).map(m=>m.action==="add"
      ?`<li><span class="mv add">Add</span>${pl(m)}${LIVE.faab&&m.bid!=null?` <span class="bid">$${m.bid}</span>`:""}</li>`
      :`<li><span class="mv">Drop</span>${pl(m)}${m.since!=null?` <span class="since${m.since>=20?" hot":""}">${m.since.toFixed(1)} pts since</span>`:""}</li>`);
  }
  return `<article class="tx"><div class="meta"><span class="kind">${TX_KINDS[kind]}</span><span class="by">${by}</span>
    ${date?`<time datetime="${date.toISOString()}" title="${esc(date.toLocaleString())}">${date.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"})}</time>`:""}</div>
    <ul>${lines.join("")}</ul></article>`;
}

function rosterBody(tab){
  if(tab==="transactions"){
    const touches=(x,id)=>x.moves.some(m=>m.team===id||m.from===id||m.to===id);
    const list=LIVE.transactions.filter(x=>(txKind==="all"||x.types.includes(txKind))&&(txTeam==="all"||touches(x,+txTeam)));
    return `<p class="tx-count">${list.length} ${list.length===1?"transaction":"transactions"}</p>
      ${list.length?`<div class="txs">${list.map(txCard).join("")}</div>`:`<div class="empty"><h3>Nothing here</h3><p>No transactions match those filters.</p></div>`}`;
  }
  const rs=LIVE.rosters.filter(r=>rosterTeam==="all"||r.espnId===+rosterTeam)
    .sort((a,b)=>teamLabel(teamById(a.espnId)||{name:""}).localeCompare(teamLabel(teamById(b.espnId)||{name:""})));
  return `<div class="rosters">${rs.map(rosterCard).join("")}</div>`;
}

function rosters(tab){
  tab=tab==="transactions"?"transactions":"rosters";
  const tabs=`<div class="tabs">${[["rosters","Rosters"],["transactions","Transactions"]].map(([k,l])=>
    `<a href="#/rosters${k==="rosters"?"":"/"+k}" ${k===tab?'aria-current="page"':""}>${l}</a>`).join("")}</div>`;
  const head=`<h2>Rosters</h2><p class="lede">${tab==="rosters"
    ?"Every team's current roster with season fantasy points."
    :`Waiver claims, free agent adds, drops and trades, newest first.${LIVE&&LIVE.faab?" Waiver bids are FAAB dollars.":""} Dropped players show what they've scored since.`}</p>`;
  if(!LIVE||!LIVE.rosters||!LIVE.transactions) return `<section>${head}${tabs}<div class="empty"><h3>No roster data yet</h3>
    <p>Rosters and transactions load from ESPN with the daily update. Run the "Daily ESPN update" workflow from the Actions tab to fill this in now.</p></div></section>`;
  const opts=(cur,list)=>list.map(([v,l])=>`<option value="${v}" ${String(v)===String(cur)?"selected":""}>${esc(l)}</option>`).join("");
  const teamOpts=teamsByName().map(t=>[t.espnId,t.manager&&M[t.manager]?`${M[t.manager].name}: ${t.name}`:t.name]);
  const filters=tab==="rosters"
    ?`<label>Team<select id="rs-team">${opts(rosterTeam,[["all","All teams"],...teamOpts])}</select></label>`
    :`<label>Type<select id="tx-kind">${opts(txKind,[["all","All types"],...Object.entries(TX_KINDS).map(([k,l])=>[k,l+"s"])])}</select></label>
      <label>Manager<select id="tx-team">${opts(txTeam,[["all","All managers"],...teamsByName().map(t=>[t.espnId,teamLabel(t)])])}</select></label>`;
  return `<section>${head}${tabs}
    <p class="live-note">Last updated from ESPN ${new Date(LIVE.updated).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</p>
    <div class="filters">${filters}</div>
    <div id="rs-body">${rosterBody(tab)}</div></section>`;
}

function setupRosters(tab){
  const body=document.getElementById("rs-body"); if(!body) return;
  const bind=(id,set)=>{const el=document.getElementById(id); if(el) el.onchange=()=>{set(el.value); body.innerHTML=rosterBody(tab);};};
  bind("rs-team",v=>rosterTeam=v); bind("tx-kind",v=>txKind=v); bind("tx-team",v=>txTeam=v);
}

/* ---------- Forum ---------- */
// The publishable (anon) key is safe to have here: it can only read posts and call forum_post(),
// which checks the passcode inside Supabase. See supabase/forum.sql.
const FORUM={url:"https://uppbazlahrfbjjxpfuzl.supabase.co", key:"sb_publishable_HL-D0PiQE5VKQaCdWP91rg_YajYa-WD", max:1000};
const POSTERS=Object.keys(M).filter(id=>!M[id].former);
const clen=s=>[...s.trim()].length;
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

async function sb(path, body){
  const h={apikey:FORUM.key};
  if(FORUM.key.startsWith("eyJ")) h.Authorization="Bearer "+FORUM.key;
  if(body) h["Content-Type"]="application/json";
  let r;
  try{ r=await fetch(`${FORUM.url}/rest/v1/${path}`,{method:body?"POST":"GET",headers:h,body:body&&JSON.stringify(body),cache:"no-store"}); }
  catch(e){ throw new Error("Couldn't reach the forum. Try again in a minute."); }
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j&&j.message||`Forum error (${r.status}).`);
  return j;
}
function ago(t){
  const s=Math.max(0,(Date.now()-new Date(t))/1000), d=s/86400;
  return s<60?"just now":s<3600?`${Math.floor(s/60)}m ago`:s<86400?`${Math.floor(s/3600)}h ago`:
    d<30?`${Math.floor(d)}d ago`:d<365?`${Math.floor(d/30)}mo ago`:`${Math.floor(d/365)}y ago`;
}
const postHtml=p=>`<div class="post"><div class="meta"><span class="au">${esc(M[p.author]?M[p.author].name:p.author)}</span>
  <time datetime="${esc(p.created_at)}" title="${esc(new Date(p.created_at).toLocaleString())}">${ago(p.created_at)}</time></div>
  <p class="body">${esc(p.body)}</p></div>`;
const footHtml=label=>`<div class="form-foot"><span class="count">0/${FORUM.max}</span><span class="msg" role="status"></span><button class="btn" type="submit">${label}</button></div>`;

function forum(){
  return `<section class="forum"><h2>Forum</h2>
    <p class="lede">Trash talk goes here. Anyone with the link can read it. Posting takes the league passcode.</p>
    ${FORUM.key?`<form class="compose" id="f-new">
      <div class="who-row">
        <label>Posting as<select id="f-name"><option value="">Pick your name</option>${POSTERS.map(id=>`<option value="${id}">${esc(M[id].name)}</option>`).join("")}</select></label>
        <label>League passcode<input id="f-pass" type="password" autocomplete="current-password"></label>
      </div>
      <label class="sr-only" for="f-body">New thread</label>
      <textarea id="f-body" name="body" rows="3" placeholder="Start a thread"></textarea>
      ${footHtml("Post")}
    </form>
    <div class="threads" id="threads"><p class="note">Loading posts…</p></div>`
    :`<div class="empty"><h3>Forum isn't connected yet</h3><p>Add the Supabase publishable key to FORUM in index.html.</p></div>`}
  </section>`;
}

async function loadThreads(){
  const el=document.getElementById("threads"); if(!el) return;
  try{
    const threads=await sb("forum_posts?select=id,author,body,created_at&parent_id=is.null&order=last_activity.desc&limit=50");
    const replies=threads.length?await sb(`forum_posts?select=id,parent_id,author,body,created_at&parent_id=in.(${threads.map(t=>t.id).join(",")})&order=created_at.asc`):[];
    if(!document.body.contains(el)) return;
    el.innerHTML=threads.length?threads.map(t=>{
      const rs=replies.filter(r=>r.parent_id===t.id);
      return `<article class="thread">${postHtml(t)}
        ${rs.length?`<div class="replies">${rs.map(postHtml).join("")}</div>`:""}
        <button class="linkbtn" type="button" data-reply="${t.id}">Reply</button>
        <form class="reply-form" data-parent="${t.id}" hidden>
          <label class="sr-only" for="r-${t.id}">Reply</label>
          <textarea id="r-${t.id}" name="body" rows="2" placeholder="Reply"></textarea>
          ${footHtml("Reply")}
        </form></article>`;}).join("")
      :`<div class="empty"><h3>No posts yet</h3><p>Somebody has to start it.</p></div>`;
  }catch(e){ el.innerHTML=`<div class="empty"><h3>Couldn't load posts</h3><p>${esc(e.message)}</p></div>`; }
}

function setupForum(){
  const form=document.getElementById("f-new"); if(!form) return;
  const name=document.getElementById("f-name"), pass=document.getElementById("f-pass");
  name.value=store.get("forum-name"); pass.value=store.get("forum-pass");
  const app=form.closest(".forum");
  app.addEventListener("input",e=>{
    const f=e.target.closest("form"); if(!f||e.target.name!=="body") return;
    const n=clen(e.target.value), c=f.querySelector(".count");
    c.textContent=`${n}/${FORUM.max}`; c.classList.toggle("over",n>FORUM.max);
  });
  app.addEventListener("click",e=>{
    const b=e.target.closest("[data-reply]"); if(!b) return;
    const f=b.nextElementSibling; f.hidden=!f.hidden; if(!f.hidden) f.querySelector("textarea").focus();
  });
  app.addEventListener("submit",async e=>{
    const f=e.target.closest("form"); if(!f||!f.querySelector("[name=body]")) return;
    e.preventDefault();
    const ta=f.querySelector("[name=body]"), msg=f.querySelector(".msg"), btn=f.querySelector("button[type=submit]");
    const say=t=>{msg.textContent=t;};
    if(!name.value){ say(f===form?"Pick your name.":"Pick your name at the top first."); name.focus(); return; }
    if(!pass.value){ say(f===form?"Enter the league passcode.":"Enter the passcode at the top first."); pass.focus(); return; }
    const n=clen(ta.value);
    if(!n){ say("Write something first."); ta.focus(); return; }
    if(n>FORUM.max){ say(`Keep it under ${FORUM.max} characters.`); ta.focus(); return; }
    btn.disabled=true; say("");
    try{
      await sb("rpc/forum_post",{p_author:name.value,p_body:ta.value,p_passcode:pass.value,p_parent_id:f.dataset.parent?+f.dataset.parent:null});
      store.set("forum-name",name.value); store.set("forum-pass",pass.value);
      ta.value=""; ta.dispatchEvent(new Event("input",{bubbles:true}));
      await loadThreads();
    }catch(err){ say(err.message); }
    finally{ btn.disabled=false; }
  });
  loadThreads();
}

/* ---------- Router ---------- */
function route(){
  const parts=(location.hash.replace(/^#\/?/,"")||"").split("/");
  const app=document.getElementById("app");
  let tab="#/";
  switch(parts[0]){
    case "seasons": app.innerHTML=season(parts[1]); tab="#/seasons/2025"; break;
    case "managers": app.innerHTML=parts[1]?profile(parts[1]):managers(); tab="#/managers"; break;
    case "records": app.innerHTML=records(); tab="#/records"; break;
    case "live": app.innerHTML=live(parts[1]); tab="#/live"; break;
    case "rosters": app.innerHTML=rosters(parts[1]); setupRosters(parts[1]); tab="#/rosters"; break;
    case "forum": app.innerHTML=forum(); setupForum(); tab="#/forum"; break;
    default: app.innerHTML=home(); renderAllTime();
  }
  document.querySelectorAll("#nav a").forEach(a=>a.getAttribute("href")===tab?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
rebuild(); route();
fetch("data/index.json",{cache:"no-store"}).then(r=>r.ok?r.json():null)
  .then(ix=>ix?Promise.all(ix.seasons.map(y=>fetch(`data/${y}.json`,{cache:"no-store"}).then(r=>r.ok?r.json():null))):[])
  .then(list=>{ LIVES=(list||[]).filter(Boolean).sort((a,b)=>a.season-b.season); LIVE=LIVES[LIVES.length-1]||null;
    // The forum doesn't use ESPN data, so don't redraw it (that would wipe a half-written post).
    if(LIVES.length){ rebuild(); if(!/^#\/forum/.test(location.hash)) route(); } })
  .catch(()=>{});
</script>
